name: Build

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'make_icon.py'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        platform: [x64, Win32]
        configuration: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build DiskC
        run: |
          msbuild DiskC.sln /p:Platform=${{ matrix.platform }} /p:Configuration=${{ matrix.configuration }} /m

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DiskC-${{ matrix.platform }}-${{ matrix.configuration }}
          path: bin/${{ matrix.platform == 'Win32' && 'x86' || 'x64' }}/${{ matrix.configuration }}/
          if-no-files-found: warn

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Generate Gradle wrapper
        run: |
          cd Mobile
          gradle wrapper --gradle-version 8.2

      - name: Build Debug APK
        run: |
          cd Mobile
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DiskC-Mobile-Debug
          path: Mobile/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
